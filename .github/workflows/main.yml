name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Valid Android Project with Launcher & Icon
        run: |
          if [ -e "app" ] && [ ! -d "app" ]; then
            mv app app_file_backup
          fi
          rm -f settings.gradle.kts build.gradle.kts app/build.gradle.kts

          mkdir -p app/src/main/java/com/elhana/iptv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 1. نسخ صورة الأيقونة المرفوعة في المستودع إلى مجلد الأيقونات
          ICON_FILE=$(find . -maxdepth 2 \( -iname "ic_launcher.*" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ تم تعيين الأيقونة من الملف: $ICON_FILE"
          fi

          # 2. نقل الملفات المبعثرة في الجذر إلى أماكنها الصحيحة إن وجدت
          if [ -f "build.gradle" ] && grep -q "com.android.application" build.gradle; then
            mv build.gradle app/build.gradle
          fi
          if [ -d "src" ]; then
            cp -rn src/* app/src/ 2>/dev/null || true
          fi

          # 3. إنشاء settings.gradle و build.gradle و gradle.properties
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "El-Hana-IPTV"' \
            'include ":app"' > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.5.2" apply false' \
            '    id "org.jetbrains.kotlin.android" version "1.9.24" apply false' \
            '}' > build.gradle

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties

          if [ ! -f "app/build.gradle" ] || ! grep -q "com.android.application" app/build.gradle; then
            printf '%s\n' \
              'plugins {' \
              '    id "com.android.application"' \
              '}' \
              'android {' \
              '    namespace "com.elhana.iptv"' \
              '    compileSdk 34' \
              '    defaultConfig {' \
              '        applicationId "com.elhana.iptv"' \
              '        minSdk 21' \
              '        targetSdk 34' \
              '        versionCode 1' \
              '        versionName "1.0"' \
              '    }' \
              '    buildTypes {' \
              '        release {' \
              '            minifyEnabled false' \
              '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' \
              '        }' \
              '    }' \
              '    compileOptions {' \
              '        sourceCompatibility JavaVersion.VERSION_17' \
              '        targetCompatibility JavaVersion.VERSION_17' \
              '    }' \
              '}' \
              'dependencies {' \
              '    implementation "androidx.appcompat:appcompat:1.6.1"' \
              '    implementation "com.google.android.material:material:1.11.0"' \
              '}' > app/build.gradle
          else
            sed -i -E "s/id ['\"]com\.android\.application['\"] version ['\"][^'\"]+['\"]/id 'com.android.application'/g" app/build.gradle
            sed -i -E "s/id ['\"]org\.jetbrains\.kotlin\.android['\"] version ['\"][^'\"]+['\"]/id 'org.jetbrains.kotlin.android'/g" app/build.gradle
          fi

          # 4. إنشاء شاشة رئيسية (MainActivity) إذا لم يكن هناك كود Java/Kotlin مرفوع
          EXISTING_JAVA=$(find app/src -name "*.java" -o -name "*.kt" | head -n 1)
          if [ -z "$EXISTING_JAVA" ]; then
            printf '%s\n' \
              'package com.elhana.iptv;' \
              'import android.os.Bundle;' \
              'import android.webkit.WebView;' \
              'import android.webkit.WebViewClient;' \
              'import androidx.appcompat.app.AppCompatActivity;' \
              'public class MainActivity extends AppCompatActivity {' \
              '    @Override' \
              '    protected void onCreate(Bundle savedInstanceState) {' \
              '        super.onCreate(savedInstanceState);' \
              '        WebView webView = new WebView(this);' \
              '        webView.getSettings().setJavaScriptEnabled(true);' \
              '        webView.setWebViewClient(new WebViewClient());' \
              '        setContentView(webView);' \
              '    }' \
              '}' > app/src/main/java/com/elhana/iptv/MainActivity.java
          fi

          # 5. تحديث AndroidManifest.xml لإضافة LAUNCHER وإظهار الأيقونة وزر Open
          ICON_ATTR=""
          if [ -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          fi

          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ] || ! grep -q "android.intent.category.LAUNCHER" app/src/main/AndroidManifest.xml; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <uses-permission android:name="android.permission.INTERNET" />' \
              '    <application' \
              '        android:allowBackup="true"' \
              "        $ICON_ATTR" \
              '        android:label="El Hana IPTV"' \
              '        android:supportsRtl="true"' \
              '        android:theme="@style/Theme.AppCompat.NoActionBar">' \
              '        <activity' \
              '            android:name=".MainActivity"' \
              '            android:exported="true">' \
              '            <intent-filter>' \
              '                <action android:name="android.intent.action.MAIN" />' \
              '                <category android:name="android.intent.category.LAUNCHER" />' \
              '            </intent-filter>' \
              '        </activity>' \
              '    </application>' \
              '</manifest>' > app/src/main/AndroidManifest.xml
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK automatically
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          else
            echo "APK file not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk

          keytool -genkey -v -keystore temp-release.keystore -alias elhana \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=ElHana IPTV, OU=Dev, O=ElHana, L=Cairo, S=Cairo, C=EG"

          "$BUILD_TOOLS_DIR/apksigner" sign --ks temp-release.keystore \
            --ks-key-alias elhana \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out "$GITHUB_WORKSPACE/El-Hana-IPTV.apk" aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/El-Hana-IPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: El-Hana-IPTV-apk
          path: El-Hana-IPTV.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: El Hana IPTV v1.0.${{ github.run_number }}
          make_latest: true
          files: El-Hana-IPTV.apk
