name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # قبول جميع تراخيص Android SDK و NDK بشكل صحيح
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # إعداد Gradle تلقائياً (يغني عن توليد gradlew يدوياً ويمنع تعارض الإصدارات)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # بناء النسخة (استخدمنا gradle مباشرة لضمان العمل حتى بدون gradlew)
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # نسخ ملف الـ APK سواء كان موقع (signed) أو غير موقع (unsigned)
      - name: Name the APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk El-Hana-IPTV.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk El-Hana-IPTV.apk
          else
            echo "APK file not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: El-Hana-IPTV-apk
          path: El-Hana-IPTV.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: El Hana IPTV (build ${{ github.run_number }})
          files: El-Hana-IPTV.apk
