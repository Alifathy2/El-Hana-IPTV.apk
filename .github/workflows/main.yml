name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # قبول تراخيص Android SDK المثبت مسبقاً
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # حل تعارض اسم app وتنظيم هيكل مشروع الأندرويد تلقائياً
      - name: Fix Conflict and Build Project Structure
        run: |
          echo "=== فحص ملفات المستودع الحالية ==="
          ls -la

          # 1. حل مشكلة وجود "ملف" باسم app يمنع إنشاء مجلد app/
          if [ -e "app" ] && [ ! -d "app" ]; then
            echo "⚠️ تم العثور على ملف (وليس مجلد) باسم app - جاري نقله إلى app_file_backup"
            mv app app_file_backup
          fi

          # 2. البحث عن app/build.gradle في حال كان المشروع داخل مجلد فرعي آخر
          APP_GRADLE=$(find . -maxdepth 3 -path "*/app/build.gradle*" | head -n 1)
          if [ -n "$APP_GRADLE" ]; then
            PROJECT_ROOT=$(dirname $(dirname "$APP_GRADLE"))
            echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
            echo "✅ تم العثور على مشروع جاهز في: $PROJECT_ROOT"
            exit 0
          fi

          echo "PROJECT_ROOT=." >> $GITHUB_ENV
          mkdir -p app/src/main/java/com/elhana/iptv
          mkdir -p app/src/main/res/values

          # 3. إذا كان build.gradle في الجذر هو ملف التطبيق نفسه (يحتوي على com.android.application)
          if [ -f "build.gradle" ] && grep -q "com.android.application" build.gradle; then
            echo "✅ نقل build.gradle الخاص بالتطبيق إلى مجلد app/"
            mv build.gradle app/build.gradle
          fi

          # نقل مجلد src أو ملف AndroidManifest.xml إن وجدوا في الجذر إلى داخل app/src/main
          if [ -d "src" ]; then
            cp -r src/* app/src/ 2>/dev/null || true
          fi
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 4. إنشاء AndroidManifest.xml افتراضي إذا لم يكن موجوداً (ضروري لنجاح assembleRelease)
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="El-Hana IPTV"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
              </application>
          </manifest>
          EOF
            echo "✅ تم إنشاء AndroidManifest.xml أساسي"
          fi

          # 5. إنشاء settings.gradle إذا كان مفقوداً
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "El-Hana-IPTV"
          include ':app'
          EOF
          fi

          # 6. إنشاء build.gradle الرئيسي
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          fi

          # 7. إنشاء app/build.gradle إذا لم يكن قد نُقل في الخطوة 3
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.elhana.iptv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.elhana.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          fi

          echo "=== تم تجهيز هيكل المشروع بنجاح ==="
          find . -maxdepth 4 -not -path '*/.*'

      # إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # بناء نسخة الـ Release
      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # تجهيز وتوقيع الـ APK تلقائياً بمفتاح مؤقت ليعمل على أي موبايل فوراً
      - name: Sign APK automatically
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          else
            echo "APK file not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk

          keytool -genkey -v -keystore temp-release.keystore -alias elhana \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=ElHana IPTV, OU=Dev, O=ElHana, L=Cairo, S=Cairo, C=EG"

          "$BUILD_TOOLS_DIR/apksigner" sign --ks temp-release.keystore \
            --ks-key-alias elhana \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out "$GITHUB_WORKSPACE/El-Hana-IPTV.apk" aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/El-Hana-IPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: El-Hana-IPTV-apk
          path: El-Hana-IPTV.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: El Hana IPTV (build ${{ github.run_number }})
          files: El-Hana-IPTV.apk
