name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Full Android App (Fixed Playback, Weather, OTA & Fixed Keystore)
        run: |
          if [ -e "app" ] && [ ! -d "app" ]; then
            mv app app_file_backup
          fi
          rm -f settings.gradle.kts build.gradle.kts app/build.gradle.kts

          mkdir -p app/src/main/java/com/elhana/iptv
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 1. نسخ ملفات واجهة IPTV المحدثة إلى مجلد assets كما هي بدون أي تشويه
          for f in index.html style.css app.js add.html version.json qr.js ota.js; do
            if [ -f "$f" ]; then
              cp "$f" "app/src/main/assets/$f"
            fi
          done
          if [ -d "fonts" ]; then
            cp -r fonts app/src/main/assets/
          fi

          # 2. ضبط روابط التحديث في app.js لتتصل بالمستودع الصحيح بصمت
          if [ -f "app/src/main/assets/app.js" ]; then
            sed -i "s|var _U1 = .*;|var _U1 = 'https://raw.githubusercontent.com/Alifathy2/El-Hana-IPTV.apk/main';|g" app/src/main/assets/app.js
            sed -i "s|var _U2 = .*;|var _U2 = 'https://alifathy2.github.io/El-Hana-IPTV.apk';|g" app/src/main/assets/app.js

            cat << 'EOF' >> app/src/main/assets/app.js

          /* --- جسر التوافق الكامل مع غلاف الأندرويد والطقس --- */
          (function () {
            function loadWeatherReliable() {
              var x = new XMLHttpRequest();
              x.open('GET', 'https://ipwho.is/', true);
              x.timeout = 8000;
              x.onload = function () {
                try {
                  var d = JSON.parse(x.responseText);
                  if (d && d.success && d.latitude && d.longitude) {
                    getMeteo(d.latitude, d.longitude, d.city || d.country || 'مصر');
                    return;
                  }
                } catch (e) {}
                getMeteo(31.036, 30.468, 'مصر');
              };
              x.onerror = x.ontimeout = function () { getMeteo(31.036, 30.468, 'مصر'); };
              x.send();
            }
            function getMeteo(lat, lon, city) {
              var w = new XMLHttpRequest();
              w.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true', true);
              w.timeout = 8000;
              w.onload = function () {
                try {
                  var res = JSON.parse(w.responseText);
                  if (res && res.current_weather) {
                    var t = Math.round(res.current_weather.temperature);
                    var c = res.current_weather.weathercode;
                    var ico = c === 0 ? '☀️' : (c <= 3 ? '⛅' : (c <= 48 ? '🌫️' : (c <= 67 ? '🌧️' : '⛈️')));
                    var elLoc = document.getElementById('hwLoc');
                    var elW = document.getElementById('hwWeather');
                    if (elLoc) elLoc.textContent = city;
                    if (elW) elW.textContent = ico + ' ' + t + '°C';
                  }
                } catch (e) {}
              };
              w.send();
            }
            setTimeout(loadWeatherReliable, 1500);
            setInterval(loadWeatherReliable, 1800000);
          })();
          EOF
          fi

          # 3. تحسين استجابة اللمس في style.css دون تكرار
          if [ -f "app/src/main/assets/style.css" ]; then
            if ! grep -q "touch-action: manipulation" app/src/main/assets/style.css; then
              printf '\n%s\n' \
                'button, input, .f, #video, #player { touch-action: manipulation; cursor: pointer; }' \
                '#cats, #content, .det-eps, .terms-body { -webkit-overflow-scrolling: touch; }' >> app/src/main/assets/style.css
            fi
          fi

          # 4. محرك التحديث التلقائي عن بُعد (OTA)
          printf '%s\n' \
            '(function () {' \
            '  try {' \
            '    var raw = localStorage.getItem("elhana.ota");' \
            '    if (raw) {' \
            '      var ota = JSON.parse(raw);' \
            '      if (ota && ota.version && ota.js && ota.css && ota.index) {' \
            '        window.EH_VER = ota.version;' \
            '        window.EH_OTA = true;' \
            '        var st = document.querySelector("link[href=\"style.css\"]");' \
            '        if (st) st.remove();' \
            '        var sTag = document.createElement("style");' \
            '        sTag.textContent = ota.css;' \
            '        document.head.appendChild(sTag);' \
            '        var m = ota.index.match(/<body[^>]*>([\s\S]*?)<\/body>/i);' \
            '        if (m) document.body.innerHTML = m[1];' \
            '        var sc = document.createElement("script");' \
            '        sc.textContent = ota.js;' \
            '        document.body.appendChild(sc);' \
            '        return;' \
            '      }' \
            '    }' \
            '  } catch (e) {}' \
            '  var def = document.createElement("script");' \
            '  def.src = "app.js";' \
            '  document.body.appendChild(def);' \
            '})();' > app/src/main/assets/ota.js

          if [ ! -f "app/src/main/assets/qr.js" ]; then
            printf '%s\n' 'window.EH_QR=null;' > app/src/main/assets/qr.js
          fi

          # 5. معالجة الأيقونة بجميع المقاسات
          ICON_FILE=$(find . -maxdepth 2 \( -iname "ic_launcher.*" -o -iname "logo.*" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
            python3 -c '
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert("RGBA")
          sizes = [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]
          for d, sz in sizes:
              im.resize((sz, sz), Image.LANCZOS).save(f"app/src/main/res/mipmap-{d}/ic_launcher.png", "PNG")
          im.resize((512, 512), Image.LANCZOS).save("app/src/main/assets/logo.png", "PNG")
          ' "$ICON_FILE"
          fi

          # 6. إعداد Gradle
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "El-Hana-IPTV"' \
            'include ":app"' > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.5.2" apply false' \
            '}' > build.gradle

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            'android {' \
            '    namespace "com.elhana.iptv"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.elhana.iptv"' \
            '        minSdk 21' \
            '        targetSdk 34' \
            '        versionCode ${{ github.run_number }}' \
            '        versionName "2.3.${{ github.run_number }}"' \
            '    }' \
            '    buildTypes {' \
            '        release {' \
            '            minifyEnabled false' \
            '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' \
            '        }' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            'dependencies {' \
            '    implementation "androidx.appcompat:appcompat:1.6.1"' \
            '}' > app/build.gradle

          # 7. كود MainActivity متوافق بالكامل مع goBack() و exitApp() و openExternal()
          printf '%s\n' \
            'package com.elhana.iptv;' \
            'import android.app.Activity;' \
            'import android.content.Intent;' \
            'import android.net.Uri;' \
            'import android.os.Build;' \
            'import android.os.Bundle;' \
            'import android.view.KeyEvent;' \
            'import android.view.View;' \
            'import android.view.WindowManager;' \
            'import android.webkit.JavascriptInterface;' \
            'import android.webkit.ValueCallback;' \
            'import android.webkit.WebChromeClient;' \
            'import android.webkit.WebSettings;' \
            'import android.webkit.WebView;' \
            'import android.webkit.WebViewClient;' \
            'import androidx.activity.OnBackPressedCallback;' \
            'import androidx.appcompat.app.AppCompatActivity;' \
            'public class MainActivity extends AppCompatActivity {' \
            '    private WebView webView;' \
            '    private ValueCallback<Uri[]> filePathCallback;' \
            '    private static final int FILE_CHOOSER_REQ = 1001;' \
            '    public class AndroidBridge {' \
            '        @JavascriptInterface' \
            '        public boolean isAndroid() { return true; }' \
            '        @JavascriptInterface' \
            '        public void exitApp() {' \
            '            runOnUiThread(new Runnable() {' \
            '                @Override' \
            '                public void run() {' \
            '                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {' \
            '                        finishAndRemoveTask();' \
            '                    } else {' \
            '                        finishAffinity();' \
            '                    }' \
            '                    android.os.Process.killProcess(android.os.Process.myPid());' \
            '                }' \
            '            });' \
            '        }' \
            '        @JavascriptInterface' \
            '        public void openExternal(String url) {' \
            '            runOnUiThread(new Runnable() {' \
            '                @Override' \
            '                public void run() {' \
            '                    try {' \
            '                        Intent i = new Intent(Intent.ACTION_VIEW);' \
            '                        i.setDataAndType(Uri.parse(url), "video/*");' \
            '                        startActivity(Intent.createChooser(i, "تشغيل الفيديو باستخدام"));' \
            '                    } catch (Exception e) {}' \
            '                }' \
            '            });' \
            '        }' \
            '        @JavascriptInterface' \
            '        public void openExternalPlayer(String url, String title) {' \
            '            openExternal(url);' \
            '        }' \
            '    }' \
            '    @Override' \
            '    protected void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);' \
            '        getWindow().getDecorView().setSystemUiVisibility(' \
            '            View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY' \
            '        );' \
            '        webView = new WebView(this);' \
            '        WebSettings ws = webView.getSettings();' \
            '        ws.setJavaScriptEnabled(true);' \
            '        ws.setDomStorageEnabled(true);' \
            '        ws.setDatabaseEnabled(true);' \
            '        ws.setAllowFileAccess(true);' \
            '        ws.setAllowContentAccess(true);' \
            '        ws.setAllowFileAccessFromFileURLs(true);' \
            '        ws.setAllowUniversalAccessFromFileURLs(true);' \
            '        ws.setMediaPlaybackRequiresUserGesture(false);' \
            '        ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);' \
            '        ws.setUserAgentString("VLC/3.0.18 LibVLC/3.0.18");' \
            '        ws.setUseWideViewPort(true);' \
            '        ws.setLoadWithOverviewMode(true);' \
            '        webView.setInitialScale(1);' \
            '        webView.addJavascriptInterface(new AndroidBridge(), "AndroidApp");' \
            '        webView.setWebViewClient(new WebViewClient());' \
            '        webView.setWebChromeClient(new WebChromeClient() {' \
            '            @Override' \
            '            public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {' \
            '                if (filePathCallback != null) filePathCallback.onReceiveValue(null);' \
            '                filePathCallback = cb;' \
            '                Intent intent = new Intent(Intent.ACTION_GET_CONTENT);' \
            '                intent.addCategory(Intent.CATEGORY_OPENABLE);' \
            '                intent.setType("image/*");' \
            '                startActivityForResult(Intent.createChooser(intent, "Choose Image"), FILE_CHOOSER_REQ);' \
            '                return true;' \
            '            }' \
            '        });' \
            '        setContentView(webView);' \
            '        webView.loadUrl("file:///android_asset/index.html");' \
            '        getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {' \
            '            @Override' \
            '            public void handleOnBackPressed() {' \
            '                webView.evaluateJavascript("if(typeof window.EH_BACK===\"function\"){window.EH_BACK();}else if(typeof goBack===\"function\"){goBack();}", null);' \
            '            }' \
            '        });' \
            '    }' \
            '    @Override' \
            '    public boolean dispatchKeyEvent(KeyEvent event) {' \
            '        if (event.getKeyCode() == KeyEvent.KEYCODE_BACK && event.getAction() == KeyEvent.ACTION_UP) {' \
            '            webView.evaluateJavascript("if(typeof window.EH_BACK===\"function\"){window.EH_BACK();}else if(typeof goBack===\"function\"){goBack();}", null);' \
            '            return true;' \
            '        }' \
            '        return super.dispatchKeyEvent(event);' \
            '    }' \
            '    @Override' \
            '    protected void onActivityResult(int req, int res, Intent data) {' \
            '        super.onActivityResult(req, res, data);' \
            '        if (req == FILE_CHOOSER_REQ && filePathCallback != null) {' \
            '            Uri[] results = (res == Activity.RESULT_OK && data != null && data.getData() != null) ? new Uri[]{data.getData()} : null;' \
            '            filePathCallback.onReceiveValue(results);' \
            '            filePathCallback = null;' \
            '        }' \
            '    }' \
            '}' > app/src/main/java/com/elhana/iptv/MainActivity.java

          # 8. إنشاء AndroidManifest.xml
          ICON_ATTR=""
          if [ -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          fi

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:usesCleartextTraffic="true"' \
            '        android:hardwareAccelerated="true"' \
            "        $ICON_ATTR" \
            '        android:label="El Hana IPTV"' \
            '        android:supportsRtl="true"' \
            '        android:theme="@style/Theme.AppCompat.NoActionBar">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden"' \
            '            android:screenOrientation="sensorLandscape"' \
            '            android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK with Fixed Deterministic Keystore
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          else
            echo "APK file not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk

          keytool -genkey -v -keystore fixed-release.keystore -alias elhana \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -startdate "2025/01/01 00:00:00" \
            -storepass elhana2025 -keypass elhana2025 \
            -dname "CN=ElHana IPTV, OU=Dev, O=ElHana, L=Cairo, S=Cairo, C=EG"

          "$BUILD_TOOLS_DIR/apksigner" sign --ks fixed-release.keystore \
            --ks-key-alias elhana \
            --ks-pass pass:elhana2025 \
            --key-pass pass:elhana2025 \
            --out "$GITHUB_WORKSPACE/El-Hana-IPTV.apk" aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/El-Hana-IPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: El-Hana-IPTV-apk
          path: El-Hana-IPTV.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: El Hana IPTV v2.3.${{ github.run_number }}
          make_latest: true
          files: El-Hana-IPTV.apk
