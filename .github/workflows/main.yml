name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # قبول تراخيص Android SDK المثبت مسبقاً
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # خطوة فحص هيكل المشروع وإصلاح الملفات الناقصة تلقائياً
      - name: Verify and Fix Project Structure
        run: |
          echo "=== هيكل الملفات الحالي في المستودع ==="
          find . -maxdepth 3 -not -path '*/.*'

          # 1. البحث عن مكان app/build.gradle إذا كان المشروع داخل مجلد فرعي
          APP_GRADLE=$(find . -maxdepth 3 -path "*/app/build.gradle*" | head -n 1)
          if [ -n "$APP_GRADLE" ]; then
            PROJECT_ROOT=$(dirname $(dirname "$APP_GRADLE"))
            echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
            echo "✅ تم العثور على المشروع في المسار: $PROJECT_ROOT"
          else
            echo "PROJECT_ROOT=." >> $GITHUB_ENV
            echo "⚠️ لم يتم العثور على app/build.gradle، جاري التحقق من إمكانية إنشائه..."
            
            mkdir -p app/src/main

            # إنشاء settings.gradle إذا كان مفقوداً
            if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
              cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "El-Hana-IPTV"
          include ':app'
          EOF
              echo "✅ تم إنشاء settings.gradle"
            fi

            # إنشاء build.gradle الرئيسي إذا كان مفقوداً
            if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
              cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
              echo "✅ تم إنشاء build.gradle الرئيسي"
            fi

            # إنشاء app/build.gradle إذا كان مفقوداً
            if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
              cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.elhana.iptv'
              compileSdk 34

              defaultConfig {
                  applicationId "com.elhana.iptv"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
              echo "✅ تم إنشاء app/build.gradle"
            fi
          fi

      # إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # بناء نسخة الـ Release من المسار الصحيح للمشروع
      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # تجهيز وتوقيع الـ APK تلقائياً
      - name: Sign APK automatically
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          else
            echo "APK file not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk

          keytool -genkey -v -keystore temp-release.keystore -alias elhana \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=ElHana IPTV, OU=Dev, O=ElHana, L=Cairo, S=Cairo, C=EG"

          "$BUILD_TOOLS_DIR/apksigner" sign --ks temp-release.keystore \
            --ks-key-alias elhana \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out "$GITHUB_WORKSPACE/El-Hana-IPTV.apk" aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$GITHUB_WORKSPACE/El-Hana-IPTV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: El-Hana-IPTV-apk
          path: El-Hana-IPTV.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: El Hana IPTV (build ${{ github.run_number }})
          files: El-Hana-IPTV.apk
